name: Build and test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout nexora-fido
        uses: actions/checkout@v4
        with:
          path: nexora-fido
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore nexora-fido/Nexora.Fido.sln
      - name: Build
        run: dotnet build nexora-fido/Nexora.Fido.sln -c Release --no-restore
      - name: Test
        run: dotnet test nexora-fido/Nexora.Fido.sln -c Release --no-build
